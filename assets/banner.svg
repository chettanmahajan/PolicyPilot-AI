<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 400" width="1280" height="400" role="img" aria-labelledby="title desc">
  <title id="title">PolicyPilot AI</title>
  <desc id="desc">AI-Powered Support Ticket Decision Assistant. Turning customer complaints into policy-backed decisions.</desc>
  <defs>
    <linearGradient id="ring" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#14C8B0"/>
      <stop offset="0.55" stop-color="#1C9BE0"/>
      <stop offset="1" stop-color="#1F5FE0"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.35" r="0.6">
      <stop offset="0" stop-color="#132238"/>
      <stop offset="1" stop-color="#05070B"/>
    </radialGradient>
  </defs>

  <!-- background card -->
  <rect width="1280" height="400" rx="24" fill="url(#glow)"/>

  <!-- logo tile (same artwork as assets/logo.svg, scaled to 112px) -->
  <g transform="translate(584 28) scale(0.4375)">
    <rect width="256" height="256" rx="56" fill="#FFFFFF"/>
    <circle cx="128" cy="128" r="72" fill="none" stroke="url(#ring)" stroke-width="18"
            stroke-linecap="round" stroke-dasharray="200 14 190 48.39" transform="rotate(-25.7 128 128)"/>
    <g transform="rotate(45 128 128)">
      <polygon points="128,38 80,178 128,150" fill="#3D8BFF"/>
      <polygon points="128,38 128,150 176,178" fill="#1A4FD6"/>
    </g>
  </g>

  <g font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" text-anchor="middle">
    <text x="640" y="212" font-size="64" font-weight="700" fill="#FFFFFF">PolicyPilot AI</text>
    <text x="640" y="258" font-size="26" fill="#C8CDD5">AI-Powered Support Ticket Decision Assistant</text>

    <rect x="440" y="280" width="400" height="40" rx="20" fill="#0E1F38"/>
    <text x="640" y="307" font-size="20" font-weight="600" fill="#5AA2FF">Gemini · RAG · FastAPI · Streamlit</text>

    <text x="640" y="366" font-size="27" fill="#FFFFFF">Turning customer complaints into policy-backed decisions.</text>
  </g>
</svg>
